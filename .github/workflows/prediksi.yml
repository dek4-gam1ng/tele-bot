name: Prediksi Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      nama:
        description: 'Nama prediksi untuk tes manual'
        required: true
        default: 'CAMBODIA'
        type: choice
        options:
          - 'AUTO'
          - 'CAMBODIA'
          - 'TTM P1'
          - 'SYDNEY'
          - 'CHINA'
          - 'TTM P2'
          - 'JAPAN'
          - 'SGP'
          - 'TTM P3'
          - 'TAIWAN'
          - 'TTM P4'
          - 'HONGKONG'
          - 'TTM P5'
          - 'TTM P6'

permissions:
  contents: write

concurrency:
  group: telegram-delivery
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Kirim ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_NAME: ${{ inputs.nama }}
        run: python bot.py
