name: Prediksi Telegram

on:
  workflow_dispatch:
    inputs:
      nama:
        description: 'Nama prediksi untuk tes manual'
        required: true
        default: 'CAMBODIA'
        type: choice
        options:
          - 'AUTO'
          - 'AUSTRALIA'
          - 'LAOS'
          - 'SOUTHKOREA'
          - 'NORTHKOREA'
          - 'NEW YORK'
          - 'KENTUCKY EVENING'
          - 'TEXAS'
          - 'CAMBODIA'
          - 'BRUNEI'
          - 'BULLSEYE'
          - 'TTM 13'
          - 'SYDNEY'
          - 'NEWZEALAND'
          - 'CHINA'
          - 'TTM 16'
          - 'JAPAN'
          - 'SGP'
          - 'MAGNUM4D'
          - 'MEXICO'
          - 'TTM 19'
          - 'PCSO'
          - 'TAIWAN'
          - 'TTM 22'
          - 'HONGKONG'
          - 'TTM 23'
          - 'TTM 24'
          - 'KENTUCKY DAY'

permissions:
  contents: write

concurrency:
  group: telegram-delivery
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Kirim ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_NAME: ${{ inputs.nama }}
        run: python bot.py
